# docker-compose.yml (taruh di root repo, sejajar dengan folder backend/ dan frontend/)
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: https://momoney.mieintel.dev
      OLLAMA_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:1.5b
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://momoney-api.mieintel.dev
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data: