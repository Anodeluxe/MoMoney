name: Frontend CI/CD Secondary

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-secondary-ci.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/momoney-frontend
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL_SECONDARY }}
  IMAGE_TAG: secondary

jobs:
  frontend-build-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend API URL
        run: |
          test -n "${NEXT_PUBLIC_API_URL}" || {
            echo "::error::Set GitHub Actions variable NEXT_PUBLIC_API_URL_SECONDARY";
            exit 1;
          }

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
            -t momoney-frontend:ci \
            ./frontend

      - name: Run container
        run: |
          docker run -d --name momoney-frontend-ci \
            -p 3000:3000 \
            momoney-frontend:ci

      - name: Wait for startup
        run: sleep 10

      - name: Smoke test
        run: curl --fail --silent --show-error http://127.0.0.1:3000

      - name: Print logs
        if: always()
        run: docker logs momoney-frontend-ci

      - name: Cleanup
        if: always()
        run: docker rm -f momoney-frontend-ci

  frontend-push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: frontend-build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/momoney-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/momoney-frontend:secondary
          cache-to: type=inline
